<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b57d0"><link rel="icon" href="img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/common.css?v=70"><link rel="stylesheet" href="css/shared/ai-analytics.css?v=70"><link rel="stylesheet" href="css/pages/ai-chat.css?v=70"><script src="js/boot.js?v=70" defer></script><script src="js/data.js?v=70" defer></script><script src="js/common.js?v=70" defer></script><script src="js/shared/ai-analytics.js?v=70" defer></script><script src="js/pages/ai-chat.js?v=70" defer></script><title>研究数据对话 · 中国中医风湿病注册研究信息平台</title></head><body><header class="app-header"><a class="brand" href="projects.html"><img src="img/logo.svg" width="38" height="38" alt=""><span>中国中医风湿病注册研究信息平台<small>China TCM Rheumatic Disease Registry Information Platform</small></span></a><div class="header-actions"><div class="account"><span class="avatar">陈</span><span>陈医生<small>研究者</small></span></div></div></header><div class="app-layout"><aside class="sidebar"></aside><main id="main"><div class="breadcrumb">智能分析 <span>/</span> <a href="ai-analysis.html">AI 智能分析</a> <span>/</span> 研究数据对话</div>
<div class="page-heading"><div><h1>研究数据对话</h1><p>围绕研究数据库、当前队列或单个患者提问；回答附数据依据，可一键转为队列分析。</p></div><span class="demo-flag live-flag"><i></i>数据实时同步</span></div>
<div class="chat-layout">
<aside class="chat-side ai-panel"><button type="button" class="new-chat" id="new-chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>开启新对话</button>
<h2>对话范围</h2><div class="scope-list" id="scope-list">
<label><input type="radio" name="scope" value="all" checked><span><b>整个研究数据库</b><small id="scope-all-note"></small></span></label>
<label id="scope-cohort-wrap" hidden><input type="radio" name="scope" value="cohort"><span><b>当前队列</b><small id="scope-cohort-note"></small></span></label>
<label><input type="radio" name="scope" value="patient"><span><b>单个患者</b><small>选择后针对该患者的病程提问</small></span></label>
</div><div class="picker" id="patient-picker" hidden><input id="picker" type="search" autocomplete="off" placeholder="输入姓名、ID号或研究编号" aria-label="选择患者"><div class="picker-list" id="picker-list" hidden></div></div>
<h2 class="side-title">历史对话</h2><div class="history-list" id="history"></div></aside>
<section class="chat-main ai-panel"><div class="chat-log" id="chat-log" aria-live="polite"><div class="chat-welcome" id="welcome"><div class="welcome-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 13.6 9l4.4 1.6-4.4 1.6L12 16.7l-1.6-4.5L6 10.6 10.4 9 12 4.5Z"/><path d="M18.5 3.5v3M17 5h3M6 16.5v3M4.5 18h3"/></svg></div><h2>我是研究数据助手，很高兴见到你！</h2><p id="welcome-sub">我可以帮你分析研究数据库中的患者数据，请把你的问题交给我吧～</p><div class="welcome-cards" id="suggest"></div></div></div>
<form class="chat-compose" id="chat-form"><div class="compose-box"><textarea id="chat-input" rows="1" autocomplete="off" placeholder="给研究数据助手发送消息，Enter 发送，Shift + Enter 换行"></textarea><div class="compose-bar"><div class="compose-tools"><button type="button" class="ai-deep on" id="deep-toggle" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3Z"/><path d="M9.5 20.5h5"/></svg>深度思考</button><button type="button" class="ai-deep on" id="db-toggle" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>检索研究数据库</button></div><button class="ai-send" id="chat-send" type="submit" aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><i class="ai-stop-icon"></i></button></div></div><p class="compose-note">内容由 AI 基于研究数据生成，仅供参考，请结合临床实际判断</p></form></section>
</div></main></div></body></html>
