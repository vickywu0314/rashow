<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b57d0"><link rel="icon" href="img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/common.css?v=71"><link rel="stylesheet" href="css/shared/patient-list.css?v=71"><link rel="stylesheet" href="css/pages/followups.css?v=71"><script src="js/boot.js?v=71" defer></script><script src="js/data.js?v=71" defer></script><script src="js/common.js?v=71" defer></script><script src="js/pages/followups.js?v=71" defer></script><title>随访管理 · 中国中医风湿病注册研究信息平台</title></head><body><header class="app-header"><a class="brand" href="projects.html"><img src="img/logo.svg" width="38" height="38" alt=""><span>中国中医风湿病注册研究信息平台<small>China TCM Rheumatic Disease Registry Information Platform</small></span></a><div class="header-actions"><div class="account"><span class="avatar">陈</span><span>陈医生<small>研究者</small></span></div></div></header><div class="app-layout"><aside class="sidebar"></aside><main id="main"><div class="breadcrumb">研究执行 <span>/</span> 随访管理</div><div class="page-heading"><div><h1>随访管理</h1><p id="fu-summary">集中查看待随访、逾期和近期随访患者，减少研究执行中的遗漏。</p></div></div><section class="quality-summary" id="fu-kpi"></section><form id="search-form" class="toolbar" role="search"><label class="search-field"><img src="img/search.svg" alt=""><input id="query" type="search" placeholder="按姓名、ID号或研究编号检索" autocomplete="off"></label><label class="select-field"><select id="fu-status" aria-label="随访状态"><option value="">全部随访状态</option><option value="overdue">已逾期</option><option value="soon">14 天内到期</option><option value="later">待随访</option></select></label><label class="select-field"><select id="fu-plan" aria-label="随访周期"><option value="">全部随访周期</option><option value="1">每 1 个月</option><option value="3">每 3 个月</option><option value="6">每 6 个月</option><option value="12">每 12 个月</option></select></label><label class="select-field"><select id="f-center" aria-label="研究中心"><option value="">全部研究中心</option><option>中国中医科学院广安门医院</option><option>中国中医科学院西苑医院</option><option>北京中医药大学东直门医院</option><option>首都医科大学附属北京中医医院</option><option>上海中医药大学附属龙华医院</option><option>上海中医药大学附属曙光医院</option><option>广东省中医院</option><option>江苏省中医院</option><option>浙江省中医院</option><option>安徽中医药大学第一附属医院</option><option>河南中医药大学第一附属医院</option><option>湖南中医药大学第一附属医院</option><option>辽宁中医药大学附属医院</option><option>天津中医药大学第一附属医院</option><option>成都中医药大学附属医院</option><option>山东中医药大学附属医院</option><option>湖北省中医院</option><option>黑龙江中医药大学附属第一医院</option><option>陕西中医药大学附属医院</option><option>云南省中医医院</option></select></label><button class="button primary" type="submit">查询</button><button class="button" id="reset" type="button">重置</button></form><div class="list-actions-bar"><button class="button primary" id="add-followup" type="button" disabled title="先在列表中选择一位患者">＋ 新增随访</button><span class="pick-hint" id="pick-hint">在列表中选择一位患者后录入本次随访</span></div><div class="patient-columns selectable"><span class="check-col" aria-hidden="true"></span><span>患者信息</span><span>研究信息</span><span>随访计划</span><span>预计日期</span><span>随访状态</span><span></span></div><div id="rows" class="patient-list" role="radiogroup" aria-label="选择要新增随访的患者"></div><div id="empty" class="empty-state" hidden><h2>没有匹配的随访计划</h2></div><footer class="pagination-bar"><p id="result-count"></p><div class="pagination-controls"><nav id="pagination"></nav><label class="page-size"><select id="page-size"><option value="10">每页 10 条</option><option value="20">每页 20 条</option><option value="50">每页 50 条</option></select></label></div></footer><p class="app-footnote">下次随访日期 = 上次随访日期 + 患者的随访周期（在患者档案中设置，可按 3 / 6 / 12 个月）。</p></main></div></body></html>
